<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Teste de microfone Realtime — Piloto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    main {
      width: min(100%, 650px);
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow:
        0 12px 32px
        rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin-top: 0;
    }

    p {
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      background: #f47b20;
      color: white;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #finalizar {
      background: #374151;
    }

    #status,
    #transcricao {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
    }

    #status {
      background: #eef2f7;
      white-space: pre-line;
    }

    #transcricao {
      min-height: 120px;
      background: #f8fafc;
      border: 1px solid #dbe2ea;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .sucesso {
      background: #e8f7ed !important;
      color: #176b34;
    }

    .erro {
      background: #fdecec !important;
      color: #9b1c1c;
    }

    small {
      display: block;
      margin-top: 15px;
      color: #64748b;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <main>
    <h1>Teste Realtime — Microfone</h1>

    <p>
      Inicie o teste, fale normalmente e depois
      clique em finalizar.
    </p>

    <button id="iniciar" type="button">
      Iniciar microfone
    </button>

    <button
      id="finalizar"
      type="button"
      disabled
    >
      Finalizar atendimento
    </button>

    <div
      id="status"
      role="status"
      aria-live="polite"
    >
      Aguardando início.
    </div>

    <h3>Transcrição</h3>

    <div id="transcricao">
      A transcrição aparecerá aqui.
    </div>

    <small>
      Este teste apenas transcreve.
      Nenhuma informação será enviada à planilha.
    </small>
  </main>

 <script>
  const URL_APPS_SCRIPT =
    'https://script.google.com/macros/s/AKfycbwpPUKzLliOfyaSmpi1Lgyzgv2lA4Di-VE-8hw6KbvKbsBU3dJxl-TMrwghHmHmkWFv/exec';

  const URL_REALTIME =
    'https://api.openai.com/v1/realtime/calls';

  const botaoIniciar =
    document.getElementById('iniciar');

  const botaoFinalizar =
    document.getElementById('finalizar');

  const statusElemento =
    document.getElementById('status');

  const transcricaoElemento =
    document.getElementById('transcricao');


  const metricasElemento =
    document.createElement('div');

  metricasElemento.style.marginTop = '10px';
  metricasElemento.style.fontSize = '13px';
  metricasElemento.style.color = '#64748b';

  statusElemento.after(metricasElemento);


  let conexao = null;
  let canalDados = null;

  let fluxoMicrofone = null;
  let faixaMicrofone = null;
   
let cadastroEmAndamento = false;
let iframeCadastroAtual = null;
let timeoutCadastro = null;
   
  let conexaoPronta = false;
  let preparandoConexao = null;

  let atendimentoAtivo = false;
  let finalizando = false;

  let textoParcial = '';

  let inicioClique = 0;
  let inicioFinalizacao = 0;

  let primeiraDeltaRecebida = false;

  let timeoutToken = null;
  let resolverToken = null;
  let rejeitarToken = null;


  function definirStatus(
    mensagem,
    tipo = ''
  ) {
    statusElemento.textContent = mensagem;
    statusElemento.className = tipo;
  }


  function mostrarMetricas(texto) {
    metricasElemento.textContent = texto;
  }


  function removerScriptToken() {
    const anterior =
      document.getElementById(
        'tokenRealtimeMicrofone'
      );

    if (anterior) {
      anterior.remove();
    }
  }


  function silenciarMicrofone() {
    if (faixaMicrofone) {
      faixaMicrofone.enabled = false;
    }
  }


  function ativarMicrofone() {
    if (faixaMicrofone) {
      faixaMicrofone.enabled = true;
    }
  }


  function microfoneDisponivel() {
    return (
      faixaMicrofone &&
      faixaMicrofone.readyState === 'live'
    );
  }


  async function obterMicrofone() {
    if (microfoneDisponivel()) {
      return fluxoMicrofone;
    }

    fluxoMicrofone =
      await navigator.mediaDevices
        .getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

    faixaMicrofone =
      fluxoMicrofone.getAudioTracks()[0];

    /*
     * O microfone fica preparado,
     * mas não grava até o atendimento começar.
     */
    silenciarMicrofone();

    return fluxoMicrofone;
  }


  window.receberTokenRealtimeMicrofone =
    function (dados) {

      if (timeoutToken) {
        clearTimeout(timeoutToken);
        timeoutToken = null;
      }

      removerScriptToken();

      if (
        !dados ||
        dados.sucesso !== true ||
        !dados.token
      ) {
        if (rejeitarToken) {
          rejeitarToken(
            new Error(
              dados && dados.erro
                ? dados.erro
                : 'Resposta de credencial inválida.'
            )
          );
        }

        return;
      }

      if (resolverToken) {
        resolverToken({
          token: dados.token,
          recebidoEm: Date.now()
        });
      }
    };


  function solicitarToken() {
    return new Promise(
      function (resolve, reject) {

        resolverToken = resolve;
        rejeitarToken = reject;

        removerScriptToken();

        const script =
          document.createElement('script');

        script.id =
          'tokenRealtimeMicrofone';

        script.src =
          URL_APPS_SCRIPT +
          '?acao=tokenRealtimeTeste' +
          '&callback=receberTokenRealtimeMicrofone' +
          '&_=' +
          Date.now();

        script.onerror =
          function () {
            reject(
              new Error(
                'Não foi possível receber a credencial do Apps Script.'
              )
            );
          };

        timeoutToken =
          setTimeout(
            function () {
              reject(
                new Error(
                  'O Apps Script demorou demais para responder.'
                )
              );
            },
            15000
          );

        document.head.appendChild(script);
      }
    );
  }

function enviarCadastroRealtime(texto) {
  if (
    !texto ||
    cadastroEmAndamento
  ) {
    return;
  }

  cadastroEmAndamento = true;

  definirStatus(
    'Transcrição pronta. Interpretando e cadastrando...'
  );

  const nomeIframe =
    'pilotoCadastro_' + Date.now();

  iframeCadastroAtual =
    document.createElement('iframe');

  iframeCadastroAtual.name =
    nomeIframe;

  iframeCadastroAtual.style.display =
    'none';

  document.body.appendChild(
    iframeCadastroAtual
  );


  const formulario =
    document.createElement('form');

  formulario.method = 'POST';
  formulario.action = URL_APPS_SCRIPT;
  formulario.target = nomeIframe;
  formulario.style.display = 'none';


  const campos = {
    acao: 'processar_realtime',
    texto: texto
  };


  Object.keys(campos).forEach(
    function (nome) {
      const input =
        document.createElement('input');

      input.type = 'hidden';
      input.name = nome;
      input.value = campos[nome];

      formulario.appendChild(input);
    }
  );


  document.body.appendChild(formulario);

  formulario.submit();
  formulario.remove();


  timeoutCadastro =
    setTimeout(
      function () {
        cadastroEmAndamento = false;

        definirStatus(
          'O cadastro demorou mais que o esperado.',
          'erro'
        );

        botaoIniciar.disabled = false;
      },
      30000
    );
}


window.addEventListener(
  'message',
  function (evento) {

    const origemValida =
      evento.origin ===
        'https://script.google.com' ||
      evento.origin ===
        'https://script.googleusercontent.com';

    if (!origemValida) {
      return;
    }


    const dados = evento.data;

    if (
      !dados ||
      dados.tipo !==
        'PILOTO_REALTIME_RESULTADO'
    ) {
      return;
    }


    if (timeoutCadastro) {
      clearTimeout(timeoutCadastro);
      timeoutCadastro = null;
    }


    cadastroEmAndamento = false;


    if (iframeCadastroAtual) {
      iframeCadastroAtual.remove();
      iframeCadastroAtual = null;
    }


    if (dados.sucesso !== true) {
      definirStatus(
        'Erro no cadastro:\n' +
        (
          dados.erro ||
          'Erro não identificado.'
        ),
        'erro'
      );

      botaoIniciar.disabled = false;
      botaoFinalizar.disabled = true;

      finalizando = false;

      return;
    }


    const tempoFinalPlanilha =
      inicioFinalizacao
        ? Math.round(
            performance.now() -
            inicioFinalizacao
          )
        : 0;


    definirStatus(
      'Cadastro concluído! ' +
      dados.cadastro.quantidade +
      ' aluno(s) inserido(s) na planilha.',
      'sucesso'
    );


    mostrarMetricas(
      'Finalizar → planilha: ' +
      tempoFinalPlanilha +
      ' ms | IA: ' +
      dados.metricas.interpretacaoMs +
      ' ms | Planilha: ' +
      dados.metricas.planilhaMs +
      ' ms'
    );


    atendimentoAtivo = false;
    finalizando = false;

    botaoIniciar.disabled = false;
    botaoFinalizar.disabled = true;

    silenciarMicrofone();
  }
);
  function tratarEventoRealtime(evento) {
    console.log(
      '[REALTIME]',
      evento
    );


    if (
      evento.type ===
      'conversation.item.input_audio_transcription.delta'
    ) {
      const delta =
        String(evento.delta || '');

      textoParcial += delta;

      transcricaoElemento.textContent =
        textoParcial || 'Ouvindo...';


      if (!primeiraDeltaRecebida) {
        primeiraDeltaRecebida = true;

        const tempo =
          Math.round(
            performance.now() -
            inicioClique
          );

        mostrarMetricas(
          'Clique → primeiro texto: ' +
          tempo +
          ' ms'
        );
      }

      return;
    }


   if (
  evento.type ===
  'conversation.item.input_audio_transcription.completed'
) {
  const textoFinal =
    String(
      evento.transcript ||
      textoParcial ||
      ''
    ).trim();


  if (textoFinal) {
    transcricaoElemento.textContent =
      textoFinal;
  }


  const tempoTranscricao =
    inicioFinalizacao
      ? Math.round(
          performance.now() -
          inicioFinalizacao
        )
      : 0;


  mostrarMetricas(
    'Finalizar → transcrição: ' +
    tempoTranscricao +
    ' ms'
  );


  if (!textoFinal) {
    falhar(
      'Nenhuma fala foi identificada.'
    );

    return;
  }


  enviarCadastroRealtime(
    textoFinal
  );

  return;
}


      

    if (evento.type === 'error') {
      const mensagem =
        evento.error &&
        evento.error.message
          ? evento.error.message
          : 'A OpenAI retornou um erro.';

      falhar(
        'Erro Realtime:\n' +
        mensagem
      );
    }
  }


 function conexaoAindaValida() {
  const diagnostico = {
    conexaoPronta: conexaoPronta,
    canal:
      canalDados
        ? canalDados.readyState
        : 'inexistente',
    microfone:
      faixaMicrofone
        ? faixaMicrofone.readyState
        : 'inexistente',
    conexao:
      conexao
        ? conexao.connectionState
        : 'inexistente'
  };

  console.log(
    '[REUTILIZACAO]',
    diagnostico
  );

  window.ultimoDiagnostico =
    diagnostico;

  return (
    conexaoPronta &&
    conexao &&
    canalDados &&
    canalDados.readyState === 'open' &&
    microfoneDisponivel()
  );
}


  async function criarConexaoRealtime(
    token
  ) {
    conexao =
      new RTCPeerConnection();


    conexao.addEventListener(
      'connectionstatechange',
      function () {
        if (
          conexao.connectionState ===
            'failed' ||
          conexao.connectionState ===
            'closed'
        ) {
          conexaoPronta = false;
        }
      }
    );


    conexao.addTrack(
      faixaMicrofone,
      fluxoMicrofone
    );


    canalDados =
      conexao.createDataChannel(
        'oai-events'
      );


    canalDados.addEventListener(
      'message',
      function (mensagem) {
        try {
          tratarEventoRealtime(
            JSON.parse(
              mensagem.data
            )
          );
        } catch (erro) {
          console.error(
            'Evento inválido:',
            mensagem.data
          );
        }
      }
    );


    const canalAberto =
      new Promise(
        function (resolve, reject) {

          canalDados.addEventListener(
            'open',
            function () {
              conexaoPronta = true;
              resolve();
            },
            { once: true }
          );


          canalDados.addEventListener(
            'error',
            function () {
              reject(
                new Error(
                  'Falha ao abrir o canal Realtime.'
                )
              );
            },
            { once: true }
          );
        }
      );


    const oferta =
      await conexao.createOffer();


    await conexao.setLocalDescription(
      oferta
    );


    const resposta =
      await fetch(
        URL_REALTIME,
        {
          method: 'POST',

          headers: {
            Authorization:
              'Bearer ' + token,

            'Content-Type':
              'application/sdp'
          },

          body: oferta.sdp
        }
      );


    if (!resposta.ok) {
      const detalhe =
        await resposta.text();

      throw new Error(
        'HTTP ' +
        resposta.status +
        ': ' +
        detalhe
      );
    }


    const respostaSDP =
      await resposta.text();


    await conexao.setRemoteDescription({
      type: 'answer',
      sdp: respostaSDP
    });


    await canalAberto;
  }


  async function prepararConexao() {
    if (conexaoAindaValida()) {
      return;
    }


    if (preparandoConexao) {
      return preparandoConexao;
    }


    preparandoConexao =
      (async function () {

        definirStatus(
          'Preparando microfone e conexão...'
        );


        /*
         * PONTO PRINCIPAL DA V2:
         *
         * microfone e token são solicitados
         * AO MESMO TEMPO.
         */
        const resultados =
          await Promise.all([
            obterMicrofone(),
            solicitarToken()
          ]);


        let credencial =
          resultados[1];


        /*
         * Se a pessoa demorou demais
         * na autorização do microfone,
         * busca uma credencial nova.
         */
        if (
          Date.now() -
            credencial.recebidoEm >
          45000
        ) {
          credencial =
            await solicitarToken();
        }


        await criarConexaoRealtime(
          credencial.token
        );

      })();


    try {
      await preparandoConexao;
    } finally {
      preparandoConexao = null;
    }
  }


  async function iniciar() {
    if (
      atendimentoAtivo ||
      finalizando
    ) {
      return;
    }


    inicioClique =
      performance.now();

    inicioFinalizacao = 0;

    textoParcial = '';

    primeiraDeltaRecebida = false;


    transcricaoElemento.textContent =
      'Preparando atendimento...';


    botaoIniciar.disabled = true;
    botaoFinalizar.disabled = true;


    mostrarMetricas('');


    try {
const reutilizando =
  conexaoAindaValida();
      await prepararConexao();


      /*
       * Da segunda vez em diante,
       * chegaremos praticamente direto aqui.
       */
      ativarMicrofone();


      atendimentoAtivo = true;


      const tempoPronto =
        Math.round(
          performance.now() -
          inicioClique
        );


      definirStatus(
        'Gravando. Pode falar normalmente.',
        'sucesso'
      );


     const diagnostico =
  window.ultimoDiagnostico || {};

mostrarMetricas(
  'Clique → microfone pronto: ' +
  tempoPronto +
  ' ms | ' +
  'Reutilizou: ' +
  (reutilizando ? 'SIM' : 'NÃO') +
  ' | Canal: ' +
  (diagnostico.canal || '-') +
  ' | Mic: ' +
  (diagnostico.microfone || '-') +
  ' | Conexão: ' +
  (diagnostico.conexao || '-')
);

      transcricaoElemento.textContent =
        'Ouvindo...';


      botaoFinalizar.disabled = false;

    } catch (erro) {

      falhar(
        'Não foi possível iniciar.\n' +
        (
          erro && erro.message
            ? erro.message
            : String(erro)
        )
      );
    }
  }


  function finalizar() {
    if (
      !atendimentoAtivo ||
      finalizando ||
      !canalDados ||
      canalDados.readyState !== 'open'
    ) {
      return;
    }


    finalizando = true;
    atendimentoAtivo = false;


    /*
     * Para de mandar áudio imediatamente.
     * A conexão continua aberta.
     */
    silenciarMicrofone();


    inicioFinalizacao =
      performance.now();


    botaoFinalizar.disabled = true;


    definirStatus(
      'Finalizando atendimento...'
    );


    canalDados.send(
      JSON.stringify({
        type:
          'input_audio_buffer.commit'
      })
    );
  }


  function falhar(mensagem) {
    atendimentoAtivo = false;
    finalizando = false;

    silenciarMicrofone();

    definirStatus(
      mensagem,
      'erro'
    );

    botaoIniciar.disabled = false;
    botaoFinalizar.disabled = true;

    conexaoPronta = false;


    if (canalDados) {
      try {
        canalDados.close();
      } catch (erro) {
      }

      canalDados = null;
    }


    if (conexao) {
      try {
        conexao.close();
      } catch (erro) {
      }

      conexao = null;
    }
  }


  botaoIniciar.addEventListener(
    'click',
    iniciar
  );


  botaoFinalizar.addEventListener(
    'click',
    finalizar
  );


  window.addEventListener(
    'pagehide',
    function () {

      if (fluxoMicrofone) {
        fluxoMicrofone
          .getTracks()
          .forEach(
            function (track) {
              track.stop();
            }
          );
      }


      if (conexao) {
        conexao.close();
      }
    }
  );
</script>
