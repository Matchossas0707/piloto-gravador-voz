<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Teste de microfone Realtime — Piloto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    main {
      width: min(100%, 650px);
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow:
        0 12px 32px
        rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin-top: 0;
    }

    p {
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      background: #f47b20;
      color: white;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #finalizar {
      background: #374151;
    }

    #status,
    #transcricao {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
    }

    #status {
      background: #eef2f7;
      white-space: pre-line;
    }

    #transcricao {
      min-height: 120px;
      background: #f8fafc;
      border: 1px solid #dbe2ea;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .sucesso {
      background: #e8f7ed !important;
      color: #176b34;
    }

    .erro {
      background: #fdecec !important;
      color: #9b1c1c;
    }

    small {
      display: block;
      margin-top: 15px;
      color: #64748b;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <main>
    <h1>Teste Realtime — Microfone</h1>

    <p>
      Inicie o teste, fale normalmente e depois
      clique em finalizar.
    </p>

    <button id="iniciar" type="button">
      Iniciar microfone
    </button>

    <button
      id="finalizar"
      type="button"
      disabled
    >
      Finalizar atendimento
    </button>

    <div
      id="status"
      role="status"
      aria-live="polite"
    >
      Aguardando início.
    </div>

    <h3>Transcrição</h3>

    <div id="transcricao">
      A transcrição aparecerá aqui.
    </div>

    <small>
      Este teste apenas transcreve.
      Nenhuma informação será enviada à planilha.
    </small>
  </main>

 <script>
  const URL_APPS_SCRIPT =
    'https://script.google.com/macros/s/AKfycbwpPUKzLliOfyaSmpi1Lgyzgv2lA4Di-VE-8hw6KbvKbsBU3dJxl-TMrwghHmHmkWFv/exec';

  const URL_REALTIME =
    'https://api.openai.com/v1/realtime/calls';

  const botaoIniciar =
    document.getElementById('iniciar');

  const botaoFinalizar =
    document.getElementById('finalizar');

  const statusElemento =
    document.getElementById('status');

  const transcricaoElemento =
    document.getElementById('transcricao');


  const metricasElemento =
    document.createElement('div');

  metricasElemento.style.marginTop = '10px';
  metricasElemento.style.fontSize = '13px';
  metricasElemento.style.color = '#64748b';

  statusElemento.after(metricasElemento);


  let conexao = null;
  let canalDados = null;

  let fluxoMicrofone = null;
  let faixaMicrofone = null;
   
let cadastroEmAndamento = false;
let iframeCadastroAtual = null;
let timeoutCadastro = null;
   
  let conexaoPronta = false;
  let preparandoConexao = null;

  let atendimentoAtivo = false;
  let finalizando = false;

  let textoParcial = '';

  let inicioClique = 0;
  let inicioFinalizacao = 0;

  let primeiraDeltaRecebida = false;

  let timeoutToken = null;
  let resolverToken = null;
  let rejeitarToken = null;
// ========================================
// PRÉ-INTERPRETAÇÃO REALTIME
// ========================================

let conexaoPreInterpretacao = null;
let canalPreInterpretacao = null;

let conexaoPreInterpretacaoPronta = false;
let preparandoPreInterpretacao = null;

let timeoutTokenPreInterpretacao = null;
let resolverTokenPreInterpretacao = null;
let rejeitarTokenPreInterpretacao = null;

/*
 * Aqui ficará o cadastro que a IA
 * vai montando enquanto a pessoa fala.
 */
let cadastroProvisorio = null;
let timerPreInterpretacaoTexto = null;

let preInterpretacaoTextoEmAndamento = false;

let preInterpretacaoTextoPendente = false;

let ultimoTextoEnviadoPreIA = '';
   
let aguardandoPreIAFinal = false;

let resolverPreIAFinal = null;

let timeoutPreIAFinal = null;

let textoFinalAguardadoPreIA = '';

let preIAFinalDisparada = false;   
   
  function definirStatus(
    mensagem,
    tipo = ''
  ) {
    statusElemento.textContent = mensagem;
    statusElemento.className = tipo;
  }


  function mostrarMetricas(texto) {
    metricasElemento.textContent = texto;
  }


  function removerScriptToken() {
    const anterior =
      document.getElementById(
        'tokenRealtimeMicrofone'
      );

    if (anterior) {
      anterior.remove();
    }
  }


  function silenciarMicrofone() {
    if (faixaMicrofone) {
      faixaMicrofone.enabled = false;
    }
  }


  function ativarMicrofone() {
    if (faixaMicrofone) {
      faixaMicrofone.enabled = true;
    }
  }


  function microfoneDisponivel() {
    return (
      faixaMicrofone &&
      faixaMicrofone.readyState === 'live'
    );
  }


  async function obterMicrofone() {
    if (microfoneDisponivel()) {
      return fluxoMicrofone;
    }

    fluxoMicrofone =
      await navigator.mediaDevices
        .getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

    faixaMicrofone =
      fluxoMicrofone.getAudioTracks()[0];

    /*
     * O microfone fica preparado,
     * mas não grava até o atendimento começar.
     */
    silenciarMicrofone();

    return fluxoMicrofone;
  }


  window.receberTokenRealtimeMicrofone =
    function (dados) {

      if (timeoutToken) {
        clearTimeout(timeoutToken);
        timeoutToken = null;
      }

      removerScriptToken();

      if (
        !dados ||
        dados.sucesso !== true ||
        !dados.token
      ) {
        if (rejeitarToken) {
          rejeitarToken(
            new Error(
              dados && dados.erro
                ? dados.erro
                : 'Resposta de credencial inválida.'
            )
          );
        }

        return;
      }

      if (resolverToken) {
        resolverToken({
          token: dados.token,
          recebidoEm: Date.now()
        });
      }
    };


 function solicitarToken() {
  return new Promise(
    function (resolve, reject) {

      resolverToken = resolve;
      rejeitarToken = reject;

      removerScriptToken();

      const script =
        document.createElement('script');

      script.id =
        'tokenRealtimeMicrofone';

      script.src =
        URL_APPS_SCRIPT +
        '?acao=tokenRealtimeTeste' +
        '&callback=receberTokenRealtimeMicrofone' +
        '&_=' +
        Date.now();

      script.onerror =
        function () {
          reject(
            new Error(
              'Não foi possível receber a credencial do Apps Script.'
            )
          );
        };

      timeoutToken =
        setTimeout(
          function () {
            reject(
              new Error(
                'O Apps Script demorou demais para responder.'
              )
            );
          },
          15000
        );

      document.head.appendChild(script);
    }
  );
}


window.receberTokenPreInterpretacaoRealtime =
  function (dados) {

    if (timeoutTokenPreInterpretacao) {
      clearTimeout(
        timeoutTokenPreInterpretacao
      );

      timeoutTokenPreInterpretacao = null;
    }

    if (
      !dados ||
      dados.sucesso !== true ||
      !dados.token
    ) {
      const mensagem =
        dados && dados.erro
          ? dados.erro
          : 'Não foi possível obter o token da pré-interpretação.';

      if (rejeitarTokenPreInterpretacao) {
        rejeitarTokenPreInterpretacao(
          new Error(mensagem)
        );
      }

      resolverTokenPreInterpretacao = null;
      rejeitarTokenPreInterpretacao = null;

      return;
    }

    if (resolverTokenPreInterpretacao) {
      resolverTokenPreInterpretacao({
        token: dados.token,
        modelo: dados.modelo,
        expiraEm: dados.expiraEm
      });
    }

    resolverTokenPreInterpretacao = null;
    rejeitarTokenPreInterpretacao = null;
  };


function solicitarTokenPreInterpretacao() {
  return new Promise(
    function (resolve, reject) {

      resolverTokenPreInterpretacao =
        resolve;

      rejeitarTokenPreInterpretacao =
        reject;

      const script =
        document.createElement('script');

      script.src =
        URL_APPS_SCRIPT +
        '?acao=tokenPreInterpretacao' +
        '&callback=receberTokenPreInterpretacaoRealtime' +
        '&t=' +
        Date.now();

      script.onerror =
        function () {

          if (timeoutTokenPreInterpretacao) {
            clearTimeout(
              timeoutTokenPreInterpretacao
            );
          }

          resolverTokenPreInterpretacao = null;
          rejeitarTokenPreInterpretacao = null;

          reject(
            new Error(
              'Falha ao buscar o token da pré-interpretação.'
            )
          );

          script.remove();
        };

      script.onload =
        function () {
          script.remove();
        };

      document.head.appendChild(script);

      timeoutTokenPreInterpretacao =
        setTimeout(
          function () {

            resolverTokenPreInterpretacao = null;
            rejeitarTokenPreInterpretacao = null;

            reject(
              new Error(
                'O token da pré-interpretação demorou demais para responder.'
              )
            );
          },
          15000
        );
    }
  );
}
function agendarPreInterpretacaoTexto() {
  if (timerPreInterpretacaoTexto) {
    return;
  }

  timerPreInterpretacaoTexto =
    setTimeout(
      function () {
        timerPreInterpretacaoTexto = null;

        enviarTextoParaPreInterpretacao();
      },
      800
    );
}


function enviarTextoParaPreInterpretacao() {
  if (
    !preInterpretacaoAindaValida() ||
    !canalPreInterpretacao
  ) {
    return;
  }

  const textoAtual =
    String(textoParcial || '').trim();

  if (!textoAtual) {
    return;
  }

  /*
   * Se a Pré-IA ainda estiver processando
   * o envio anterior, marcamos que existe
   * texto novo esperando.
   */
  if (preInterpretacaoTextoEmAndamento) {
    preInterpretacaoTextoPendente = true;
    return;
  }

  if (
    textoAtual ===
    ultimoTextoEnviadoPreIA
  ) {
    return;
  }

  let trechoNovo = textoAtual;

  /*
   * Envia somente o trecho que ainda
   * não foi passado para a Pré-IA.
   */
  if (
    ultimoTextoEnviadoPreIA &&
    textoAtual.startsWith(
      ultimoTextoEnviadoPreIA
    )
  ) {
    trechoNovo =
      textoAtual
        .slice(
          ultimoTextoEnviadoPreIA.length
        )
        .trim();
  }

  if (!trechoNovo) {
    return;
  }

  ultimoTextoEnviadoPreIA =
    textoAtual;

  preInterpretacaoTextoEmAndamento =
    true;

  preInterpretacaoTextoPendente =
    false;


  canalPreInterpretacao.send(
    JSON.stringify({
      type:
        'conversation.item.create',

      item: {
        type: 'message',
        role: 'user',

        content: [
          {
            type: 'input_text',
            text: trechoNovo
          }
        ]
      }
    })
  );


  canalPreInterpretacao.send(
    JSON.stringify({
      type: 'response.create'
    })
  );
}
function dispararCadastroFinalPreIA() {
  if (
    !aguardandoPreIAFinal ||
    preIAFinalDisparada ||
    !canalPreInterpretacao ||
    canalPreInterpretacao.readyState !== 'open'
  ) {
    return;
  }

  preIAFinalDisparada = true;

  preInterpretacaoTextoEmAndamento =
    true;

  canalPreInterpretacao.send(
    JSON.stringify({
      type:
        'conversation.item.create',

      item: {
        type: 'message',
        role: 'user',

        content: [
          {
            type: 'input_text',

            text:
              'TRANSCRIÇÃO FINAL AUTORITATIVA DO ATENDIMENTO.\n' +
              'Ignore qualquer divergência existente nos trechos incrementais anteriores.\n' +
              'Use esta versão final como fonte correta para nomes, autoescola, instrutor, alunos, pagamentos, correções e exclusões.\n' +
              'Retorne o estado FINAL COMPLETO chamando atualizar_cadastro_provisorio.\n\n' +
              textoFinalAguardadoPreIA
          }
        ]
      }
    })
  );

  canalPreInterpretacao.send(
    JSON.stringify({
      type: 'response.create'
    })
  );
}


function aguardarCadastroFinalPreIA(
  textoFinal
) {
  const texto =
    String(textoFinal || '').trim();

  return new Promise(
    function (resolve) {

      if (
        !texto ||
        !preInterpretacaoAindaValida() ||
        !canalPreInterpretacao
      ) {
        resolve(null);
        return;
      }


      if (timerPreInterpretacaoTexto) {
        clearTimeout(
          timerPreInterpretacaoTexto
        );

        timerPreInterpretacaoTexto = null;
      }

      preInterpretacaoTextoPendente =
        false;

      textoFinalAguardadoPreIA =
        texto;

      aguardandoPreIAFinal =
        true;

      preIAFinalDisparada =
        false;

      resolverPreIAFinal =
        resolve;


      if (timeoutPreIAFinal) {
        clearTimeout(
          timeoutPreIAFinal
        );
      }

      timeoutPreIAFinal =
        setTimeout(
          function () {

            timeoutPreIAFinal = null;

            aguardandoPreIAFinal =
              false;

            preIAFinalDisparada =
              false;

            resolverPreIAFinal =
              null;

            resolve(null);
          },
          5000
        );


      /*
       * Se uma interpretação incremental
       * ainda estiver sendo gerada,
       * cancelamos apenas essa resposta.
       *
       * Assim que o servidor confirmar
       * o cancelamento, enviaremos
       * a transcrição final.
       */
      if (
        preInterpretacaoTextoEmAndamento
      ) {
        canalPreInterpretacao.send(
          JSON.stringify({
            type: 'response.cancel'
          })
        );

        return;
      }


      dispararCadastroFinalPreIA();
    }
  );
}
function configurarFerramentaPreInterpretacao(dc) {
 dc.send(

function mostrarCadastroProvisorioNaTela() {
  let caixa =
    document.getElementById(
      'cadastroProvisorioPreIA'
    );

  if (!caixa) {
    caixa =
      document.createElement('pre');

    caixa.id =
      'cadastroProvisorioPreIA';

    caixa.style.whiteSpace =
      'pre-wrap';

    caixa.style.wordBreak =
      'break-word';

    caixa.style.padding =
      '16px';

    caixa.style.marginTop =
      '16px';

    caixa.style.border =
      '1px solid #ccc';

    caixa.style.borderRadius =
      '12px';

    caixa.style.fontSize =
      '14px';

    caixa.style.textAlign =
      'left';

    const pai =
      transcricaoElemento &&
      transcricaoElemento.parentElement;

    if (pai) {
      pai.insertBefore(
        caixa,
        transcricaoElemento
      );
    } else {
      document.body.appendChild(
        caixa
      );
    }
  }

  if (!cadastroProvisorio) {
    caixa.textContent =
      'Pré-IA: aguardando informações...';

    return;
  }

  caixa.textContent =
    'Pré-IA — cadastro provisório:\n\n' +
    JSON.stringify(
      cadastroProvisorio,
      null,
      2
    );
}
   function processarEventoPreInterpretacao(
  dados,
  dc
) {
  if (
    dados.type !== 'response.done' ||
    !dados.response ||
    !Array.isArray(
      dados.response.output
    )
  ) {
    return;
  }

  const chamada =
    dados.response.output.find(
      function (item) {
        return (
          item.type === 'function_call' &&
          item.name ===
            'atualizar_cadastro_provisorio'
        );
      }
    );

  if (!chamada) {
    return;
  }

  try {
    cadastroProvisorio =
      JSON.parse(
        chamada.arguments || '{}'
      );
    mostrarCadastroProvisorioNaTela();

    console.log(
      '[PRE-IA CADASTRO]',
      cadastroProvisorio
    );

  } catch (erro) {
    console.error(
      '[PRE-IA] JSON inválido:',
      chamada.arguments
    );

    return;
  }

  /*
   * Confirma para a IA que o estado
   * provisório foi recebido.
   */
  if (
    chamada.call_id &&
    dc &&
    dc.readyState === 'open'
  ) {
    dc.send(
      JSON.stringify({
        type:
          'conversation.item.create',

        item: {
          type:
            'function_call_output',

          call_id:
            chamada.call_id,

          output:
            JSON.stringify({
              sucesso: true
            })
        }
      })
    );
  }
}
function preInterpretacaoAindaValida() {
  return (
    conexaoPreInterpretacaoPronta &&
    conexaoPreInterpretacao &&
    canalPreInterpretacao &&
    canalPreInterpretacao.readyState === 'open' &&
    faixaMicrofone &&
    faixaMicrofone.readyState === 'live'
  );
}


async function prepararPreInterpretacao() {
  if (preInterpretacaoAindaValida()) {
    return;
  }

  if (preparandoPreInterpretacao) {
    return preparandoPreInterpretacao;
  }

  preparandoPreInterpretacao =
    (async function () {

      await obterMicrofone();

      const dadosToken =
        await solicitarTokenPreInterpretacao();

      const pc =
        new RTCPeerConnection();

      const dc =
        pc.createDataChannel(
          'oai-events-pre'
        ); /*
 * O WebRTC da OpenAI exige uma seção
 * de áudio no SDP.
 *
 * recvonly cria essa seção, mas NÃO
 * envia o microfone para a Pré-IA.
 * Ela continuará recebendo somente texto.
 */
pc.addTransceiver(
  'audio',
  {
    direction: 'recvonly'
  }
);

     dc.addEventListener(
  'message',
  function (evento) {
    try {
      const dados =
        JSON.parse(evento.data);

      const caixa =
        document.getElementById(
          'cadastroProvisorioPreIA'
        );

      console.log(
        '[PRE-IA EVENTO]',
        dados
      );

      if (dados.type === 'error') {
        const mensagem =
          dados.error &&
          dados.error.message
            ? dados.error.message
            : JSON.stringify(dados);

        if (caixa) {
          caixa.textContent =
            'Pré-IA — ERRO:\n\n' +
            mensagem;
        }

        return;
      }


      if (
        dados.type ===
        'session.updated'
      ) {
        if (
          caixa &&
          !cadastroProvisorio
        ) {
          caixa.textContent =
            'Pré-IA: sessão configurada ✅';
        }

        return;
      }


      if (
        dados.type ===
        'input_audio_buffer.speech_started'
      ) {
        if (
          caixa &&
          !cadastroProvisorio
        ) {
          caixa.textContent =
            'Pré-IA: ouvindo a fala... 🎤';
        }

        return;
      }


      if (
        dados.type ===
        'input_audio_buffer.speech_stopped'
      ) {
        if (
          caixa &&
          !cadastroProvisorio
        ) {
          caixa.textContent =
            'Pré-IA: fala recebida. Interpretando...';
        }

        return;
      }


      if (
        dados.type ===
        'response.created'
      ) {
        if (
          caixa &&
          !cadastroProvisorio
        ) {
          caixa.textContent =
            'Pré-IA: resposta criada...';
        }

        return;
      }


   if (
  dados.type ===
  'response.done'
) {
  const statusResposta =
    dados.response &&
    dados.response.status
      ? dados.response.status
      : '';

  /*
   * Só processamos cadastro de uma
   * resposta realmente concluída.
   */
  if (
    statusResposta === 'completed'
  ) {
    processarEventoPreInterpretacao(
      dados,
      dc
    );
  }

  preInterpretacaoTextoEmAndamento =
    false;


  /*
   * Estamos no processo de Finalizar.
   */
  if (aguardandoPreIAFinal) {

    /*
     * A resposta incremental anterior
     * acabou/cancelou.
     *
     * Agora podemos disparar a análise
     * da transcrição FINAL.
     */
    if (!preIAFinalDisparada) {
      dispararCadastroFinalPreIA();
      return;
    }


    /*
     * Esta já é a resposta da
     * transcrição FINAL.

  async function criarConexaoRealtime(
    token
  ) {
    conexao =
      new RTCPeerConnection();


    conexao.addEventListener(
      'connectionstatechange',
      function () {
        if (
          conexao.connectionState ===
            'failed' ||
          conexao.connectionState ===
            'closed'
        ) {
          conexaoPronta = false;
        }
      }
    );


    conexao.addTrack(
      faixaMicrofone,
      fluxoMicrofone
    );


    canalDados =
      conexao.createDataChannel(
        'oai-events'
      );


    canalDados.addEventListener(
      'message',
      function (mensagem) {
        try {
          tratarEventoRealtime(
            JSON.parse(
              mensagem.data
            )
          );
        } catch (erro) {
          console.error(
            'Evento inválido:',
            mensagem.data
          );
        }
      }
    );


    const canalAberto =
      new Promise(
        function (resolve, reject) {

          canalDados.addEventListener(
            'open',
            function () {
              conexaoPronta = true;
              resolve();
            },
            { once: true }
          );


          canalDados.addEventListener(
            'error',
            function () {
              reject(
                new Error(
                  'Falha ao abrir o canal Realtime.'
                )
              );
            },
            { once: true }
          );
        }
      );


    const oferta =
      await conexao.createOffer();


    await conexao.setLocalDescription(
      oferta
    );


    const resposta =
      await fetch(
        URL_REALTIME,
        {
          method: 'POST',

          headers: {
            Authorization:
              'Bearer ' + token,

            'Content-Type':
              'application/sdp'
          },

          body: oferta.sdp
        }
      );


    if (!resposta.ok) {
      const detalhe =
        await resposta.text();

      throw new Error(
        'HTTP ' +
        resposta.status +
        ': ' +
        detalhe
      );
    }


    const respostaSDP =
      await resposta.text();


    await conexao.setRemoteDescription({
      type: 'answer',
      sdp: respostaSDP
    });


    await canalAberto;
  }

      preparandoConexao = null;
